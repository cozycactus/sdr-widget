# OpenOCD transport config: Atmel-ICE (CMSIS-DAP) -> AT32UC3A3256 over generic JTAG.
#
# We use OpenOCD purely as a CMSIS-DAP + JTAG transport. OpenOCD has no native
# AVR32 UC3 target/flash support, so the UC3-specific programming protocol is
# implemented host-side (see ../uc3jtag.py) via raw irscan/drscan over Tcl-RPC.
#
# WIRING -- EITHER the AVR port or the SAM port works. Per Microchip's docs the
# two Atmel-ICE connectors are "directly electrically connected" -- same JTAG
# signals (TCK/TMS/TDI/TDO/nSRST/VTG), just different pin positions. The
# "SAM=CMSIS-DAP / AVR=atprogram" split is about software protocol, not the
# physical pins, so CMSIS-DAP JTAG reaches the UC3 through the AVR port too.
# Use whichever connector matches your target board's pinout.
#
#   signal            AVR port pin   SAM port pin
#   ----------------  ------------   ------------
#   VTG (ref sense)        4              1
#   TMS                    5              2
#   TCK                    1              4
#   TDO                    3              6
#   TDI                    9              8
#   nSRST (RESET_N)        6             10     (optional now; for reset-halt later)
#   GND                  2,10           3,5,9
#
# The board must be powered by its own supply; the Atmel-ICE only senses VTG.
# (red ribbon stripe = pin 1)

source [find interface/cmsis-dap.cfg]
transport select jtag

# Conservative clock for first contact. Raise (e.g. 1000) once the chain is stable.
adapter speed 100

# IDCODE does not need SRST; keep reset handling out of the way for now.
reset_config none

# AVR32 UC3 TAP: 5-bit instruction register. Per IEEE 1149.1 the device ID is
# loaded into DR on TAP reset, so `init` reads and prints the IDCODE for us.
# No -expected-id: we want to discover and report whatever is actually there.
jtag newtap uc3 cpu -irlen 5

# NOTE: callers run `init` themselves so the Python tool can set `tcl_port`
# during the config phase first. For a quick standalone check:
#     openocd -f openocd/uc3a3.cfg -c "init; scan_chain; shutdown"
